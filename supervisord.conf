[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
command=gosu dev ttyd -p 7681 -c dev:%(ENV_TTYD_PASSWORD)s -W tmux new-session -A -s main
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:filebrowser]
command=gosu dev filebrowser --database /var/lib/filebrowser/filebrowser.db --root /home/dev --address 0.0.0.0 --port 8080
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
