[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wetty]
; Genuine SSH client, not a pty-exec: connects to this same container's own
; sshd on localhost, so auth is real PAM/shadow (identical to a normal SSH
; login) — no separate credential store, no plaintext password stashed
; anywhere for this. --ssh-user pre-fills the username so the browser only
; prompts for the password. autorestart handles the brief window where
; wetty starts before sshd is actually accepting connections yet.
command=gosu dev wetty --ssh-host=localhost --ssh-port=22 --ssh-user=dev --host=0.0.0.0 --port=3000
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:filebrowser]
command=gosu dev filebrowser --database /var/lib/filebrowser/filebrowser.db --root /home/dev --address 0.0.0.0 --port 8080
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
