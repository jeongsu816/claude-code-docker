[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
; No -c/auth flag: ttyd has no auth of its own here, deliberately (see
; README/CLAUDE.md "접속과 인증" — do not publish TTYD_PORT outside a
; trusted network without another access-control layer in front of it).
command=gosu dev ttyd -p 7681 -W tmux new-session -A -s main
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:filebrowser]
command=gosu dev filebrowser --database /var/lib/filebrowser/filebrowser.db --root /home/dev --address 0.0.0.0 --port 8080
directory=/home/dev
environment=HOME="/home/dev",USER="dev"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
